name: Supabase ébrentartás

# Az ingyenes Supabase-projektet a szolgáltató szünetelteti, ha egy hétig alig kap
# adatbázis-forgalmat. Ritka kitöltésnél ez leállítaná a kérdéssor levélküldését,
# ezért naponta egyszer meghívjuk a függvényt, ami egy adatbázis-lekérdezést futtat.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 "https://tfjtkwjmrxbhvkktmmau.supabase.co/functions/v1/kerdessor"
